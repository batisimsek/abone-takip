<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f6fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ANET"><title>ANET • Dinle ve Yaz</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;color:#17324a;background:#f2f6fb}main{max-width:700px;margin:auto;padding:16px}h1{font-size:25px;margin:8px 0}.sub{color:#647587;margin:6px 0 18px}.panel{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #18345610}button{cursor:pointer;font:inherit;border:0}.action{border-radius:13px;padding:12px 16px;background:#e8f0fa;color:#16364e;font-weight:700}.primary{background:#246792;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0}.letter{width:67px;height:78px;border:2px solid currentColor;border-radius:14px;font-size:42px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}.slots{min-height:113px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}.slot{width:60px;height:75px;border:2px dashed #a9bacb;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f9fbfe;font-size:43px;font-weight:800}.slot.filled{border-style:solid}.meta{text-align:center;color:#65788c;font-size:14px}.feedback{text-align:center;font-size:20px;font-weight:800;min-height:32px;padding:8px}.next{width:100%;margin-top:10px}.dragging{position:fixed;pointer-events:none;z-index:1000;opacity:.8;transform:scale(1.12)}.switch{display:flex;justify-content:center;gap:8px;margin:14px}.switch button{padding:8px 13px;border-radius:12px;background:#e8eef5}.switch button.active{background:#226c9e;color:white}small{color:#728395}.note{font-size:13px;color:#6b7e91}</style></head><body><main><h1>🔤 ANET • Dinle ve Yaz</h1><p class="sub">Sesi dinle, doğru harfleri sürükle ve yerleştir.</p><section class="panel"><div class="meta" id="counter"></div><div style="text-align:center;margin:14px 0"><button class="action primary" id="listen">🔊 Örneği dinle</button></div><div class="meta">Kelime gizli. Duyduğunu yaz.</div><div id="slots" class="slots"></div><div class="actions" style="justify-content:center"><button class="action" id="erase">⌫ Geri al</button><button class="action" id="check">✓ Kontrol et</button><button class="action" id="reveal">👁 Cevabı göster</button></div><div id="feedback" class="feedback" aria-live="polite"></div><button class="action primary next" id="next">Sonraki örnek →</button></section><section class="panel"><b>Harfleri sürükle veya dokun</b><div class="switch"><button class="active" id="lower">Küçük harf</button><button id="upper">Büyük harf</button></div><div id="letters" class="letters"></div><p class="note">iPhone'da sürükleme sorun yaşatırsa harfe dokunman da harfi yerleştirir. Seslendirme cihazın Türkçe ses desteğine bağlıdır.</p></section></main><script>
const words=['an','at','en','et','ne','ta','te','na','ten','net','tane','nane','anne','anten','anneanne'];
const colors={a:['#b93132','#fff0ed'],n:['#196bb1','#edf5ff'],e:['#16834d','#edf9f0'],t:['#8340ab','#f6efff']};
let index=0,answer=[],uppercase=false,drag=null,dragStarted=false;
const $=id=>document.getElementById(id),target=()=>words[index],letter=s=>uppercase?s.toUpperCase():s;
function say(){let text=target();if(!('speechSynthesis'in window)){ $('feedback').textContent='Ses desteği yok';return}speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(text);s.lang='tr-TR';s.rate=.73;speechSynthesis.speak(s)}
function add(ch,at){if(at===undefined||at<0)at=answer.findIndex(s=>!s);if(at<0)return;answer[at]=ch.toLowerCase();$('feedback').textContent='';draw()}
function draw(){ $('counter').textContent=(index+1)+' / '+words.length+' örnek';$('slots').replaceChildren();for(let i=0;i<target().length;i++){let s=document.createElement('div');s.className='slot'+(answer[i]?' filled':'');s.dataset.index=i;if(answer[i]){let key=answer[i],palette=colors[key];s.textContent=letter(key);s.style.color=palette[0];s.style.background=palette[1];s.onclick=()=>{answer[i]=null;draw()}}$('slots').append(s)} }
function renderLetters(){$('letters').replaceChildren();for(let ch of ['a','n','e','t']){let b=document.createElement('button');b.className='letter';b.textContent=letter(ch);b.style.color=colors[ch][0];b.style.background=colors[ch][1];b.addEventListener('pointerdown',ev=>{dragStarted=false;const sx=ev.clientX,sy=ev.clientY;let active=true;const move=e=>{if(!active)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>9){dragStarted=true;if(!drag){drag=b.cloneNode(true);drag.className+=' dragging';drag.style.width='60px';drag.style.height='70px';document.body.append(drag)}drag.style.left=e.clientX-30+'px';drag.style.top=e.clientY-35+'px'}};const up=e=>{if(!active)return;active=false;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);if(drag){drag.remove();drag=null}if(dragStarted){let el=document.elementFromPoint(e.clientX,e.clientY),slot=el?.closest('.slot');if(slot)add(ch,Number(slot.dataset.index));else if(el?.closest('#slots'))add(ch);}else add(ch);};const cancel=()=>{active=false;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);drag?.remove();drag=null};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up,{once:true});window.addEventListener('pointercancel',cancel,{once:true});ev.preventDefault()});$('letters').append(b)}}
$('listen').onclick=say;$('erase').onclick=()=>{let i=answer.findLastIndex(Boolean);if(i>=0)answer[i]=null;$('feedback').textContent='';draw()};
$('check').onclick=()=>{$('feedback').textContent=answer.map(x=>x||'').join('')===target()?'✅ Harika! Doğru yazdın.':'🔁 Tekrar dene.'};
$('reveal').onclick=()=>{$('feedback').textContent='Cevap: '+letter(target());};
$('next').onclick=()=>{index=(index+1)%words.length;answer=Array(target().length).fill(null);$('feedback').textContent='';draw();say()};
for(let [id,b] of [['lower',false],['upper',true]])$(id).onclick=()=>{uppercase=b;$('lower').classList.toggle('active',!b);$('upper').classList.toggle('active',b);draw();renderLetters()};
answer=Array(target().length).fill(null);draw();renderLetters();</script></body></html>
